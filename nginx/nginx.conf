events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    # Certificate mount: this container expects a real cert + key mounted
    # read-only at /etc/nginx/certs/ (see docker-compose*.yml "nginx" service
    # volumes, e.g. add `- ./certs:/etc/nginx/certs:ro` alongside a host/secret
    # path containing novacron.crt and novacron.key -- mirrors the paths
    # documented in .env.production TLS_CERT_FILE / TLS_KEY_FILE). Never commit
    # real certificate/key material to this repo.

    # Plain HTTP: redirect everything to HTTPS except the health check, which
    # load balancers / uptime probes may hit over port 80.
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/novacron.crt;
        ssl_certificate_key /etc/nginx/certs/novacron.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 100M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript
                   application/json application/javascript application/xml+rss
                   application/rss+xml font/truetype font/opentype
                   application/vnd.ms-fontobject image/svg+xml;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
