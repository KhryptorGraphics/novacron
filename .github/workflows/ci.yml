name: CI - Canonical Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  canonical-backend:
    name: Canonical Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build canonical API server
        run: go build ./backend/cmd/api-server

      - name: Build canonical Docker image (docker/api.Dockerfile)
        # Validates the repo's declared-canonical image (see docker/api.Dockerfile
        # header / STATUS.md) actually builds on every PR. Single-arch, no push -
        # the multi-arch buildx/publish pipeline lives in a separate workflow.
        run: docker build -f docker/api.Dockerfile -t novacron-api:ci .

      # backend/core builds and its -short suite is fully green as of 2026-09-04;
      # the full census is gated below.
      - name: Run canonical backend tests
        run: >
          go test
          ./backend/cmd/api-server
          ./backend/api/graphql
          ./backend/api/security
          ./backend/api/websocket
          ./backend/pkg/config

      # backend/core is a separate Go module, so it needs its own step with a
      # working-directory rather than being appended to the go test line above.
      # Non-recursive ./vm/ (not ./vm/...) intentionally excludes the pre-existing
      # broken sibling packages vm/drivers/kvm, vm/kata, vm/unified. -short lets the
      # docker/containerd/kvm integration tests self-skip on a bare runner.
      - name: Run vm package tests (separate module)
        working-directory: backend/core
        # -race requires cgo. This gate exists to catch driver-factory-style data
        # races (see novacron-t72) before they regress invisibly.
        env:
          CGO_ENABLED: "1"
        run: go test -short -race ./vm/

      - name: Install backend/core cgo prerequisites
        # network/dwcp/transport/rdma compiles its real libibverbs variant whenever
        # cgo && linux (rdma_cgo.go: `#cgo LDFLAGS: -libverbs`; rdma_native.c includes
        # <infiniband/verbs.h>). ubuntu-latest lacks the headers; JetPack hosts ship them.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libibverbs-dev

      # The full backend/core census: every package compiles and its -short suite
      # is green (integration tests needing qemu/Docker self-skip on a bare runner;
      # the vm -race step above stays as the race gate).
      - name: Vet backend/core
        working-directory: backend/core
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Run backend/core short suite (full census)
        working-directory: backend/core
        env:
          CGO_ENABLED: "1"
        run: go test -short -timeout 30m ./...

  x86-boot-test:
    name: x86 KVM Boot Smoke Test
    runs-on: ubuntu-latest # ubuntu-latest runners are x86_64
    # Closes the x86-only-unit-tested deferral (driver_kvm_arch_test.go): actually
    # boot an x86 cirros guest. GitHub runners have no /dev/kvm, so this boots under
    # TCG software emulation, which is slow -- hence the generous job timeout -- but
    # it is blocking: this job used to be permanently red because of a bug in its own
    # boot pipeline (see the marker step), not because the guest failed to boot.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu-system-x86
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils wget

      - name: Fetch small cirros x86 image
        run: |
          wget -q https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img -O /tmp/cirros-x86.img
          qemu-img info /tmp/cirros-x86.img

      - name: Boot-test x86 guest and wait for boot marker
        # This step used to pipe qemu through `tee | grep -m1` under pipefail, which
        # failed even when the guest *did* boot: grep exits on the first match, tee
        # then dies of SIGPIPE (141) and the `&& echo` after the pipeline never runs.
        # Capture to a file instead, let `timeout` end the guest (cirros parks at its
        # login prompt and never exits on its own), then assert on the captured log.
        # Every exit status is a real failure except 124, which is `timeout` reaping
        # a guest that is still running.
        run: |
          set +e
          timeout 420 qemu-system-x86_64 \
            -machine q35 -accel tcg -m 256 \
            -drive file=/tmp/cirros-x86.img,if=virtio,format=qcow2 \
            -nographic -serial mon:stdio -no-reboot \
            > /tmp/boot.log 2>&1 < /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::qemu-system-x86_64 exited $rc"
            tail -n 40 /tmp/boot.log
            exit "$rc"
          fi
          if ! grep -qE "login:|cirros" /tmp/boot.log; then
            echo "::error::guest never reached the boot marker within 420s"
            tail -n 40 /tmp/boot.log
            exit 1
          fi
          echo "x86 guest reached boot marker (qemu rc=$rc)"

  canonical-frontend:
    name: Canonical Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run canonical frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: >
          npm test -- --runTestsByPath
          src/__tests__/app/dashboard-page.test.tsx
          src/__tests__/app/vms-page.test.tsx
          src/__tests__/app/analytics-page.test.tsx
          src/__tests__/app/settings-page.test.tsx
          src/__tests__/app/users-page.test.tsx
          src/__tests__/app/network-page.test.tsx
          src/__tests__/app/admin-layout.test.tsx
          src/__tests__/components/auth/RBACGuard.test.tsx
          src/__tests__/components/auth/RegistrationWizard.test.tsx
          src/__tests__/hooks/useSecurity.test.tsx
          src/__tests__/hooks/useWebSocket.test.tsx
          src/__tests__/lib/security-api.test.ts
          src/__tests__/lib/auth.test.ts
          src/__tests__/lib/auth-phase3.test.ts
          --coverage=false

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build canonical frontend
        working-directory: frontend
        run: npm run build

  fabric-acceptance:
    name: Fabric Two-Node Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Real end-to-end proof that two nodes can join, dispatch a job, admit a
    # queued transfer with an ETA, and migrate a VM cross-node — see
    # scripts/fabric/two-node-fabric-test.sh. Runs with FABRIC_REQUIRE_ALL=1:
    # every prerequisite below is installed explicitly, so a SKIP here is a
    # real gap (e.g. tc netem unavailable), not just an informational note.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          # Localhost-only throwaway DB for this job. Sourced from an optional repo
          # secret so a real password is masked by GitHub wherever it appears (the
          # harness tails node logs on its failure path, and those can carry the
          # DSN); the fallback is the public throwaway literal this job always used.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install fabric harness prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils socat postgresql-client iproute2 iptables

      - name: Run two-node fabric acceptance test
        env:
          FABRIC_REQUIRE_ALL: "1"
          FABRIC_PGHOST: 127.0.0.1
          FABRIC_PGPORT: "5432"
          FABRIC_PGUSER: postgres
          # Same expression as the service container above, so the two can never
          # drift apart; GitHub masks it in the log when it comes from the secret.
          FABRIC_PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        run: bash scripts/fabric/two-node-fabric-test.sh