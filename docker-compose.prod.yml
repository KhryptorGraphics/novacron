version: '3.8'

services:
  # Postgres database - SECURITY HARDENED
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novacron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-novacron}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/run/postgresql:noexec,nosuid,size=100m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novacron}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novacron-network

  # Hypervisor service
  hypervisor:
    build:
      context: .
      dockerfile: docker/hypervisor.Dockerfile
    image: novacron/hypervisor:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ID: ${NODE_ID:-node1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_PATH: ${STORAGE_PATH:-/var/lib/novacron/vms}
      CLUSTER_ADDR: api:8090
    volumes:
      - hypervisor_data:/var/lib/novacron/vms:rw
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - "no-new-privileges:true"
      - "seccomp:unconfined"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/run:noexec,nosuid,size=100m
    depends_on:
      - api
    networks:
      - novacron-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # Redis for caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"
    command: >
      redis-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --appendonly yes
      --dir /data
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:rw
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - novacron-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # DB migration tool
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: novacron/migrate:latest
    restart: "no"
    user: "1000:1000"
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-novacron}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-novacron}?sslmode=disable
    volumes:
      - migrate_bin:/shared/bin:rw
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novacron-network

  # API service
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: novacron/api:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      API_PORT: 8090
      DB_URL: postgresql://${POSTGRES_USER:-novacron}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-novacron}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET}
      HYPERVISOR_ADDRS: hypervisor:9000
      # No REDIS_*/CACHE_* keys: the canonical api-server consumes none.
      NOVACRON_MIGRATION_SECRET: ${NOVACRON_MIGRATION_SECRET}
    ports:
      - "8090:8090"
      - "8091:8091"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    volumes:
      - migrate_bin:/shared/bin:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - novacron-network

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-novacron.example.com}/api
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN:-novacron.example.com}/ws
    image: novacron/frontend:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
    ports:
      - "8092:3000"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/.next:noexec,nosuid,size=200m
    depends_on:
      - api
    networks:
      - novacron-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "65534:65534"
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus:rw
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates:/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://${DOMAIN:-novacron.example.com}/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - novacron-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: 'strict'
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: 'true'
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: 'true'
      GF_SECURITY_X_XSS_PROTECTION: 'true'
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana:rw
    ports:
      - "3001:3000"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log/grafana:noexec,nosuid,size=100m
    depends_on:
      - prometheus
    networks:
      - novacron-network

networks:
  novacron-network:
    driver: bridge

volumes:
  postgres_data:
  hypervisor_data:
  prometheus_data:
  grafana_data:
  redis_data:
  migrate_bin: