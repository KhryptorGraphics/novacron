apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacron-api
  namespace: novacron
  labels:
    app.kubernetes.io/name: novacron
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: novacron
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novacron
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
      # No prometheus.io/* scrape annotations: the api-server exposes no
      # /metrics endpoint (only GET /health on the API port).
    spec:
      serviceAccountName: novacron-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      imagePullSecrets:
        - name: novacron-registry-secret
      
      initContainers:
        # docker/migrate.Dockerfile: database/migrate.go with the canonical
        # migrations embedded; its entrypoint runs `migrate-db <args>` against
        # DB_URL. The api-server refuses to boot on an unmigrated schema.
        - name: migration
          image: novacron/migrate:latest
          imagePullPolicy: Always
          args: ["-direction=up"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: novacron-db-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      
      containers:
        - name: api-server
          image: novacron/api-server:latest
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          
          # The api-server has one listener: REST and WebSocket on API_PORT.
          ports:
            - name: http-api
              containerPort: 8090
              protocol: TCP
          
          # Env names are exactly those backend/pkg/config/config.go reads.
          env:
            - name: API_PORT
              value: "8090"
            - name: LOG_LEVEL
              value: "info"
            
            # Database Configuration
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: novacron-db-secrets
                  key: database-url
            
            # Security Configuration
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: novacron-app-secrets
                  key: auth-secret
            - name: NOVACRON_MIGRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: novacron-app-secrets
                  key: migration-secret
            # REQUIRED, operator-supplied, no default: the ingress controller's
            # pod/Service CIDR(s), comma-separated. The login rate limiter only
            # trusts X-Forwarded-For from these peers; left unset every request
            # would carry the ingress controller's address and the whole
            # cluster would share one login-limiter bucket. The ConfigMap is
            # deliberately NOT shipped in configmap.yaml (see the template
            # there): until it exists the pod stays in CreateContainerConfigError
            # and `kubectl rollout status` fails, so a forgotten value cannot
            # roll out silently.
            - name: NOVACRON_TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: novacron-proxy-trust
                  key: trusted-proxies
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: novacron-app-config
                  key: cors-allowed-origins
            - name: STORAGE_PATH
              value: "/var/lib/novacron/vms"
          
          volumeMounts:
            - name: config
              mountPath: /etc/novacron
              readOnly: true
            - name: certs
              mountPath: /etc/certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run
            # STORAGE_PATH must be writable (volume store + process-VM dirs
            # are created under it). emptyDir is node-local and lost on
            # rescheduling; switch to a PersistentVolumeClaim for durable VMs.
            - name: novacron-data
              mountPath: /var/lib/novacron
          
          livenessProbe:
            httpGet:
              path: /health
              port: http-api
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http-api
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: http-api
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18 # 3 minutes total
          
          resources:
            limits:
              cpu: 2
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
      
      volumes:
        - name: config
          configMap:
            name: novacron-app-config
        - name: certs
          secret:
            secretName: novacron-tls-certs
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: var-run
          emptyDir:
            sizeLimit: 100Mi
        - name: novacron-data
          emptyDir:
            sizeLimit: 20Gi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - novacron
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacron-frontend
  namespace: novacron
  labels:
    app.kubernetes.io/name: novacron
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: novacron
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novacron
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: "1.0.0"
    spec:
      # docker/frontend.Dockerfile runs `next start` on 3000 as uid 1001
      # (nextjs:nodejs); there is no nginx in this image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      imagePullSecrets:
        - name: novacron-registry-secret
      
      containers:
        - name: frontend
          image: novacron/frontend:latest
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next.js writes its runtime cache here; the rest of /app/.next
            # is the read-only production build.
            - name: next-cache
              mountPath: /app/.next/cache
          
          # The Next.js app has no /health route; probe the root page.
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
      
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 200Mi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novacron-postgres
  namespace: novacron
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "15"
spec:
  serviceName: novacron-postgres
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "15"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: Always
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: novacron-db-secrets
                  key: postgres-database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: novacron-db-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novacron-db-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql
              readOnly: true
            - name: certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run/postgresql
            - name: var-log
              mountPath: /var/log/postgresql
          
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          resources:
            limits:
              cpu: 2
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
      
      volumes:
        - name: postgres-config
          configMap:
            name: novacron-postgres-config
        - name: certs
          secret:
            secretName: novacron-db-tls-certs
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: var-run
          emptyDir:
            sizeLimit: 100Mi
        - name: var-log
          emptyDir:
            sizeLimit: 1Gi
  
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: novacron
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/version: "2.45.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/version: "2.45.0"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          imagePullPolicy: IfNotPresent
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          
          ports:
            - name: web
              containerPort: 9090
              protocol: TCP
          
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus/'
            - '--storage.tsdb.retention.time=30d'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
          
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: storage
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
          
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          resources:
            limits:
              cpu: 2
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
      
      volumes:
        - name: config
          configMap:
            name: novacron-prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-storage
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi