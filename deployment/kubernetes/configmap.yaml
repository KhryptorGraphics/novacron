apiVersion: v1
kind: ConfigMap
metadata:
  name: novacron-app-config
  namespace: novacron
  labels:
    app.kubernetes.io/name: novacron
    app.kubernetes.io/component: config
data:
  # The api-server (backend/cmd/api-server) is configured by environment
  # variables only (backend/pkg/config/config.go); it reads no config file.
  # Keys here are wired into container env in deployments.yaml.
  cors-allowed-origins: "https://novacron.local,https://admin.novacron.local"

---
# REQUIRED, operator-created, deliberately not shipped here:
#
#   kubectl -n novacron create configmap novacron-proxy-trust \
#     --from-literal=trusted-proxies=<ingress-controller pod/Service CIDR(s)>
#
# deployments.yaml wires its `trusted-proxies` key into the api-server's
# NOVACRON_TRUSTED_PROXIES (comma-separated IPs/CIDRs the login rate limiter
# accepts X-Forwarded-For from). Until it exists the api pods stay in
# CreateContainerConfigError and the rollout fails, so a forgotten value is
# never silently defaulted. Do not use 0.0.0.0/0 or an unverified range:
# that lets any client spoof its address to the limiter.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novacron-postgres-config
  namespace: novacron
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  postgresql.conf: |
    # PostgreSQL Configuration for NovaCron Production
    
    # Connection Settings
    listen_addresses = '*'
    port = 5432
    max_connections = 100
    
    # Memory Settings
    shared_buffers = 256MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    effective_cache_size = 1GB
    
    # WAL Settings
    wal_level = replica
    max_wal_senders = 3
    checkpoint_timeout = 5min
    checkpoint_completion_target = 0.7
    
    # Security Settings
    ssl = on
    ssl_cert_file = '/etc/ssl/certs/server.crt'
    ssl_key_file = '/etc/ssl/certs/server.key'
    ssl_ca_file = '/etc/ssl/certs/ca.crt'
    ssl_prefer_server_ciphers = on
    password_encryption = scram-sha-256
    
    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = '/var/log/postgresql'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_size = 100MB
    log_rotation_age = 1d
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_statement = 'ddl'
    
    # Performance
    random_page_cost = 1.1
    seq_page_cost = 1.0
    cpu_tuple_cost = 0.01
    cpu_index_tuple_cost = 0.005
    cpu_operator_cost = 0.0025
    
  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # Local connections
    local   all             all                                     scram-sha-256
    
    # IPv4 local connections
    host    all             all             127.0.0.1/32            scram-sha-256
    
    # IPv4 connections from pods
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             172.16.0.0/12           scram-sha-256
    host    all             all             192.168.0.0/16          scram-sha-256
    
    # Replication connections
    host    replication     all             10.0.0.0/8              scram-sha-256
    host    replication     all             172.16.0.0/12           scram-sha-256
    host    replication     all             192.168.0.0/16          scram-sha-256

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novacron-prometheus-config
  namespace: novacron
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # No novacron-api job: the api-server exposes GET /health only, not a
      # Prometheus /metrics endpoint.

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):(.*)'
            target_label: __address__
            replacement: '${1}:9100'

  alert-rules.yml: |
    groups:
      - name: novacron.rules
        rules:
          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is above 80% for more than 5 minutes"

          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Memory usage is above 85% for more than 5 minutes"

          - alert: DatabaseDown
            expr: up{job="postgres"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL database is down"
              description: "PostgreSQL database has been down for more than 1 minute"
