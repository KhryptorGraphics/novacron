apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novacron-ingress
  namespace: novacron
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - novacron.example.com
    secretName: novacron-tls
  rules:
  - host: novacron.example.com
    http:
      paths:
      # Service novacron-api exposes port 50 -> 8090 on the pod; NO rewrite, the
      # canonical server registers /api/* itself, and /ws/* is the WS endpoint
      # that the frontend expects at /ws/metrics (apiServer durable websocket).
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: novacron-api
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: novacron-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: novacron-frontend
            port:
              number: 80---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novacron-grafana-ingress
  namespace: novacron
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: novacron-basic-auth
spec:
  tls:
  - hosts:
    - grafana.novacron.example.com
    secretName: grafana-tls
  rules:
  - host: grafana.novacron.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 80
