apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacron-postgres
  namespace: novacron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novacron-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: novacron-postgres
    spec:
      containers:
      - image: postgres:15-alpine
        name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: novacron-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: novacron-secrets
              key: db-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: novacron-secrets
              key: db-name
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-persistent-storage
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: postgres-persistent-storage
        persistentVolumeClaim:
          claimName: postgres-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: novacron-postgres
  namespace: novacron
spec:
  ports:
  - port: 5432
  selector:
    app: novacron-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pv-claim
  namespace: novacron
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
