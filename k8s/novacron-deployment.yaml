apiVersion: v1
kind: Namespace
metadata:
  name: novacron
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: novacron-config
  namespace: novacron
data:
  # REDIS_URL is consumed only by backend/core/cmd/novacron's auth persistence
  # (runtime_auth_persistence.go). The canonical api-server does not read it;
  # leaving it here keeps hypervisor.auth working without dead-config noise.
  REDIS_URL: "redis://novacron-redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacron-api
  namespace: novacron
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novacron-api
  template:
    metadata:
      labels:
        app: novacron-api
    spec:
      containers:
      - name: api
        image: novacron/api:latest
        ports:
        - containerPort: 8090
        envFrom:
        - configMapRef:
            name: novacron-config
        env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: novacron-secrets
              key: auth-secret
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: novacron-secrets
              key: db-url
        - name: NOVACRON_MIGRATION_SECRET
          valueFrom:
            secretKeyRef:
              name: novacron-secrets
              key: migration-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: novacron-api
  namespace: novacron
spec:
  selector:
    app: novacron-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacron-hypervisor
  namespace: novacron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novacron-hypervisor
  template:
    metadata:
      labels:
        app: novacron-hypervisor
    spec:
      containers:
      - name: hypervisor
        image: novacron/hypervisor:latest
        ports:
        - containerPort: 9000
        securityContext:
          privileged: true
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: novacron-data
          mountPath: /var/lib/novacron
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: novacron-data
        hostPath:
          path: /var/lib/novacron
---
apiVersion: v1
kind: Service
metadata:
  name: novacron-hypervisor
  namespace: novacron
spec:
  selector:
    app: novacron-hypervisor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
  type: ClusterIP
---
# Canonical api-server's frontend is a Next.js build that needs
# NEXT_PUBLIC_API_URL baked at build time (runtime env has no effect on the
# compiled bundle). Set it to the service DNS name browsers can resolve from
# inside the cluster. The api service sits on port 80 (targetPort 8090), so
# the frontend reaches it at novacron-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacron-frontend
  namespace: novacron
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novacron-frontend
  template:
    metadata:
      labels:
        app: novacron-frontend
    spec:
      containers:
      - name: frontend
        image: novacron/frontend:latest
        ports:
        - containerPort: 3000
        # No NEXT_PUBLIC_* env injection — the image's Dockerfile bakes
        # NEXT_PUBLIC_API_URL/NEXT_PUBLIC_WS_URL from build-time ARGs.
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: novacron-frontend
  namespace: novacron
spec:
  selector:
    app: novacron-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
# No /api rewrite: the canonical api-server registers the /api/* tree
# itself, so the ingress passes it through unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novacron-ingress
  namespace: novacron
spec:
  rules:
  - host: novacron.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: novacron-frontend
            port:
              number: 80

