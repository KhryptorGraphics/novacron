version: 1
cluster:
  name: novacron-p2p
  overlay:
    ipv4_cidr: 10.77.0.0/24
    ipv6_cidr: null
    plane2_ipv4_cidr: 10.77.1.0/24
    wg_port: 51820
    wg1_port: 51821
  vxlan: {vni: 7700, port: 4789, bridge: br-p2p}
  qos: {shape_percent: 94, night_start: "02:00", night_end: "06:00", bulk_day_ceil_percent: 10}
  migration: {port_min: 49152, port_max: 49215}
  replication_defaults: {interval_min: 15, keep_last: 96, keep_daily: 14}
  alert_webhook: null
nodes:
  - name: node-a
    overlay_ipv4: 10.77.0.1
    overlay_ipv6: null
    wg_pubkey: "<44-char base64>"
    endpoint: node-a.example.net:51820
    underlay_family: ipv4
    wan_mtu: 1500
    uplink_mbit: 1000
    downlink_mbit: 1000
    wan: {interface: enp1s0, gateway: null}
    wan2: null
    ssh_pubkey: "ssh-ed25519 AAAA..."
    ssh_bulk_pubkey: "ssh-ed25519 AAAA..."
    ssh_hostkey: "ssh-ed25519 AAAA..."
    underlay_iperf: false
    zfs: {replica_root: tank/p2p-replicas}
    images_dir: /var/lib/p2pnet/images
    capacity: {vcpus: 16, ram_mib: 65536}
  - name: node-b
    overlay_ipv4: 10.77.0.2
    overlay_ipv6: null
    wg_pubkey: "<44-char base64>"
    endpoint: node-b.example.net:51820
    underlay_family: ipv4
    wan_mtu: 1500
    uplink_mbit: 1000
    downlink_mbit: 1000
    wan: {interface: enp1s0, gateway: null}
    wan2: null
    ssh_pubkey: "ssh-ed25519 AAAA..."
    ssh_bulk_pubkey: "ssh-ed25519 AAAA..."
    ssh_hostkey: "ssh-ed25519 AAAA..."
    underlay_iperf: false
    zfs: {replica_root: tank/p2p-replicas}
    images_dir: /var/lib/p2pnet/images
    capacity: {vcpus: 16, ram_mib: 65536}
replication:
  - {name: vmstore-a, source: node-a, dataset: tank/vms, targets: [node-b], interval_min: 15, keep_last: 96, keep_daily: 14}
swarm:
  base_images: [ubuntu-24.04-base.qcow2]
vms:
  - {name: web01, disk_gib: 40, vcpus: 2, ram_mib: 4096, replicas: [node-a, node-b], running_on: node-a}
