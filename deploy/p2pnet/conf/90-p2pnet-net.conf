# p2pnet high-BDP WAN tuning. BDP = rate × RTT: 1 Gbit/s × 100 ms = 12.5 MB. Linux advertises about half
# of the receive buffer as window, so 32 MiB buffers cover ~130 ms at 1 Gbit/s (~250 ms at 500 Mbit/s).
net.core.default_qdisc = fq                 # per-flow fair queue with pacing; smooths bursts BBR emits and shallow ISP buffers drop
net.ipv4.tcp_congestion_control = bbr       # model-based CC: fills long fat pipes without relying on loss; tolerant of random WAN loss
net.core.rmem_max = 33554432                # 32 MiB cap for SO_RCVBUF and the tcp_rmem autotuning ceiling
net.core.wmem_max = 33554432                # 32 MiB cap for SO_SNDBUF
net.ipv4.tcp_rmem = 4096 131072 33554432    # min / default / max: autotuning grows each socket to 32 MiB when BDP needs it
net.ipv4.tcp_wmem = 4096 65536 33554432     # min / default / max send buffer
net.ipv4.tcp_notsent_lowat = 131072         # keep at most 128 KiB unsent per socket: big wmem stays in flight, not queued (latency, HOL)
net.ipv4.tcp_mtu_probing = 1                # recover from PMTU black holes (PPPoE, WireGuard+VXLAN nesting)
net.ipv4.tcp_slow_start_after_idle = 0      # keep cwnd across idle gaps between migration/replication bursts
net.core.netdev_max_backlog = 5000          # WireGuard decrypt softirq bursts at 1 Gbit/s overflow the default 1000
