net.mptcp.enabled = 1                 # MPTCP sockets allowed (default on Ubuntu, pinned here)
net.mptcp.pm_type = 0                 # in-kernel path manager; p2pnet sets its endpoints/limits explicitly
net.ipv4.conf.all.rp_filter = 2       # loose reverse-path filter: asymmetric multi-WAN return paths are not dropped
net.ipv4.conf.default.rp_filter = 2
# Subflow limits are not sysctls: `ip mptcp limits set subflows 8 add_addr_accepted 8` runs in `p2pnet mptcp apply`.
