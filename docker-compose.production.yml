# NovaCron production stack (single-host docker compose).
#
# This file deploys the real product: the canonical api-server
# (backend/cmd/api-server), its schema migrations, the Next.js frontend, and an
# nginx reverse proxy that terminates TLS.
#
# Prerequisites (operator-supplied, never committed):
#   * .env with AUTH_SECRET (>=32 random hex), DB_PASSWORD,
#     NOVACRON_MIGRATION_SECRET, POSTGRES_USER/DB.
#   * ./certs/novacron.crt + ./certs/novacron.key for the nginx TLS listener
#     (see nginx/nginx.conf). Generate a self-signed pair for a first boot:
#       mkdir -p certs && openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#         -keyout certs/novacron.key -out certs/novacron.crt -subj "/CN=novacron.local"
#
# The frontend is built with NEXT_PUBLIC_* empty so the browser uses the
# same origin it loaded the page from; nginx then proxies /api and /graphql to
# the api service. That keeps one image working behind any hostname.
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: novacron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novacron}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-novacron}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novacron}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacron-network
    # No published port: only the api/migrate containers need to reach it.

  # Applies database/migrations before the API starts; publishes the migrate-db
  # binary on a shared volume so api-entrypoint.sh can re-run it defensively.
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: novacron/migrate:latest
    restart: "no"
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-novacron}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-novacron}?sslmode=disable
    volumes:
      - migrate_bin:/shared/bin:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novacron-network

  # Canonical api-server. Consumes ONLY the env keys backend/pkg/config reads:
  # AUTH_SECRET, DB_URL, API_PORT, LOG_LEVEL, NOVACRON_* (see config.go).
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: novacron/api:latest
    container_name: novacron-api
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 8090
      DB_URL: postgresql://${POSTGRES_USER:-novacron}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-novacron}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NOVACRON_MIGRATION_SECRET: ${NOVACRON_MIGRATION_SECRET:?NOVACRON_MIGRATION_SECRET is required}
      STORAGE_PATH: /var/lib/novacron/vms
    volumes:
      - migrate_bin:/shared/bin:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published: nginx is the only ingress.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - novacron-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      # Empty by design: origin.ts falls back to window.location.origin so the
      # browser talks to nginx, which proxies /api to the api service.
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    image: novacron/frontend:latest
    container_name: novacron-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - novacron-network

  nginx:
    image: nginx:1.27-alpine
    container_name: novacron-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS material for the 443 listener (see the header of this file).
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    networks:
      - novacron-network

volumes:
  postgres_data:
    driver: local
  migrate_bin:
    driver: local

networks:
  novacron-network:
    driver: bridge